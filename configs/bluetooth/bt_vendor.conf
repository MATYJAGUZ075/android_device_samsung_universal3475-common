# Vendor patch file for the on-board Bluetooth controller.
#
# The transport library reports the controller as present but has no idea
# which image to load, so it never patches the chip up and the adapter
# stays unusable:
#
#   bt_hwcfg: FW patchfile: (empty)
#
# Verified on the device: with this file the transport resolves and logs
#   bt_hwcfg: FW patchfile: /vendor/firmware/bcm43438A1_V0055.0244.hcd
FwPatchFileName = bcm43438A1_V0055.0244.hcd